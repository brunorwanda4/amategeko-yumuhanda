[workspace]
resolver = "2"
default-members = [
    "crates/core",
    "crates/app",
    "crates/desktop",
    "crates/mobile",
]
members = [
    "crates/core",
    "crates/app",
    "crates/desktop",
    "crates/mobile",
    "crates/web-spike",
    "crates/web",
    "crates/core-alias",
]

[workspace.package]
version = "1.8.0"
edition = "2021"
license = "Apache-2.0"

[workspace.dependencies]
amategeko-core = { path = "crates/core" }
amategeko-app = { path = "crates/app", default-features = false }

# Pinned GPUI & GPUI-Kit ecosystem matching gpui-pre-mobile baseline
gpui = { package = "gpui-pre", version = "=0.3.8", default-features = false }
gpui-mobile = { package = "gpui-pre-mobile", git = "https://github.com/longbridge/gpui-mobile", rev = "f9fe5a76f0e05ed8e5725ba692d5406bea168ac9" }
gpui-kit = { version = "=0.7.1", default-features = false, features = ["component", "assets"] }

serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
semver = "1.0.28"
ureq = { version = "3.4.2", default-features = false, features = ["rustls"] }
minisign-verify = "0.3.0"
rand = "0.8"
thiserror = "1.0"
log = "0.4"
directories = "5.0"
rust-embed = "8.12.0"
anyhow = "1.0"

[profile.dev]
opt-level = 1
debug = "line-tables-only"
incremental = true

[profile.web]
inherits = "release"
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
