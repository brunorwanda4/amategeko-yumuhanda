[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/app",
    "crates/desktop",
    "crates/mobile",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[workspace.dependencies]
amategeko-core = { path = "crates/core" }
amategeko-app = { path = "crates/app" }

# Pinned GPUI & GPUI-Kit ecosystem matching gpui-pre-mobile baseline
gpui = { package = "gpui-pre", version = "=0.3.4", default-features = false }
gpui-mobile = { package = "gpui-pre-mobile", git = "https://github.com/longbridge/gpui-mobile", rev = "0b882efdac7f524e0bb0b1d4c886b2aa752f9f20" }
gpui-kit = { git = "https://github.com/longbridge/gpui-kit", rev = "7d9efcd2069f9eaa6eb3ba6345aac4aa7d87c9f7", default-features = false, features = ["component", "assets"] }

serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rand = "0.8"
thiserror = "1.0"
log = "0.4"
directories = "5.0"
rust-embed = "8.12.0"
anyhow = "1.0"

[profile.dev]
opt-level = 1
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 3
