name: Deploy Web

on:
  push:
    branches:
      - main
    paths:
      - 'website/**'
      - 'crates/**'
      - 'assets/**'
      - 'scripts/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/deploy-web.yml'
  workflow_dispatch:
    inputs:
      full_bank:
        description: 'Deploy full question bank (requires ALLOW_FULL_BANK=yes repository variable)'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: deploy-web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Validate question bank selection
        run: |
          FULL_BANK="${{ inputs.full_bank }}"
          ALLOW_FULL_BANK="${{ vars.ALLOW_FULL_BANK }}"
          if [ "$FULL_BANK" = "true" ]; then
            if [ "$ALLOW_FULL_BANK" != "yes" ]; then
              echo "Error: full_bank deployment requested, but repository variable ALLOW_FULL_BANK is not set to 'yes' (current: '$ALLOW_FULL_BANK')." >&2
              exit 1
            fi
            echo "QUESTION_SET=full" >> "$GITHUB_ENV"
            echo "Deployment configured with full question bank."
          else
            echo "QUESTION_SET=samples" >> "$GITHUB_ENV"
            echo "Deployment configured with samples question bank."
          fi

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@63fed3e2fecf6f7b51dc6f043341b79ef82a9ae7 # v2.9.2

      - name: Install wasm-bindgen-cli
        uses: taiki-e/install-action@ab6895351a88b908e96a4697860d4ffea5e57dbe # v2.87.27
        with:
          tool: wasm-bindgen-cli@0.2.129

      - name: Install wasm-opt (Binaryen version_122)
        run: |
          curl -fsSL https://github.com/WebAssembly/binaryen/releases/download/version_122/binaryen-version_122-x86_64-linux.tar.gz | sudo tar -xz --strip-components=1 -C /usr/local

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Build WebAssembly runtime
        run: |
          chmod +x scripts/build-web.sh
          if [ "$QUESTION_SET" = "full" ]; then
            ./scripts/build-web.sh --full
          else
            ./scripts/build-web.sh
          fi

          if [ ! -f website/public/runtime/build.json ]; then
            echo "Error: website/public/runtime/build.json is missing after build." >&2
            exit 1
          fi

          if ! ls website/public/runtime/*.wasm >/dev/null 2>&1; then
            echo "Error: WASM binary is missing in website/public/runtime/ after build." >&2
            exit 1
          fi

      - name: Install website dependencies
        working-directory: website
        run: bun install --frozen-lockfile

      - name: Deploy to Vercel (prebuilt)
        working-directory: website
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          bunx vercel@63.1.2 pull --yes --environment=production --token "$VERCEL_TOKEN"
          bunx vercel@63.1.2 build --prod --token "$VERCEL_TOKEN"

          OUTPUT_DIR=".vercel/output"
          if [ ! -d "$OUTPUT_DIR" ]; then
            OUTPUT_DIR="out"
          fi
          TOTAL_SIZE_KB=$(du -sk "$OUTPUT_DIR" | cut -f1)
          TOTAL_SIZE_MB=$(bun -e "console.log(($TOTAL_SIZE_KB / 1024).toFixed(2))")
          echo "Total build output size: ${TOTAL_SIZE_KB} KB (${TOTAL_SIZE_MB} MB) in $OUTPUT_DIR"
          if [ "$TOTAL_SIZE_KB" -gt 92160 ]; then
            echo "Error: Deployment output size (${TOTAL_SIZE_MB} MB) exceeds 90 MB limit." >&2
            exit 1
          fi

          DEPLOY_URL=$(bunx vercel@63.1.2 deploy --prebuilt --prod --token "$VERCEL_TOKEN")
          echo "DEPLOY_URL=$DEPLOY_URL" >> "$GITHUB_ENV"

      - name: Print deployment summary
        run: |
          echo "========================================="
          echo "Deployment successful!"
          echo "URL: $DEPLOY_URL"
          for wasm_path in website/public/runtime/*.wasm; do
            if [ -f "$wasm_path" ]; then
              wasm_bytes=$(stat -c%s "$wasm_path")
              wasm_mb=$(bun -e "console.log(($wasm_bytes / 1024 / 1024).toFixed(2))")
              echo "Wasm binary: $wasm_path ($wasm_bytes bytes / ${wasm_mb} MB)"
            fi
          done
          echo "========================================="
