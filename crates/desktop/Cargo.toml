[package]
name = "desktop"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "amategeko"
path = "src/main.rs"

[dependencies]
amategeko-core.workspace = true
amategeko-app = { workspace = true, default-features = false }
gpui.workspace = true
gpui-kit.workspace = true
directories.workspace = true
log.workspace = true

[features]
default = ["self-update"]
self-update = ["amategeko-app/self-update"]

[build-dependencies]
winresource = "0.1"
