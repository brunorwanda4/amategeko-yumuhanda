[package]
name = "amategeko-app"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
amategeko-core.workspace = true
gpui.workspace = true
gpui-kit.workspace = true
serde.workspace = true
serde_json.workspace = true
rand.workspace = true
log.workspace = true
rust-embed.workspace = true
anyhow.workspace = true
ureq = { workspace = true, optional = true }
minisign-verify = { workspace = true, optional = true }

[features]
default = ["self-update"]
self-update = ["dep:ureq", "dep:minisign-verify"]

# Soft keyboard show/hide + IME text callback for questions search (APK only).
[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
gpui-mobile.workspace = true

[dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }
