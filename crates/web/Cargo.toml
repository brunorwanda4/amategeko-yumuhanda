[package]
name = "web"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
amategeko-core = { workspace = true }
amategeko-app = { workspace = true, default-features = false }
gpui = { workspace = true }
gpui-kit = { workspace = true, default-features = false, features = ["component", "assets"] }
wasm-bindgen = "0.2.113"
wasm-bindgen-futures = "0.4"
log = { workspace = true }
console_error_panic_hook = "0.1"
console_log = "1.0"
serde_json = { workspace = true }
js-sys = "0.3"

[dependencies.web-sys]
version = "0.3"
features = [
    "Window",
    "Document",
    "Storage",
    "Navigator",
    "WakeLock",
    "WakeLockSentinel",
    "WakeLockType",
    "EventTarget",
    "Event",
    "Location",
    "Performance",
    "VisibilityState",
]

[build-dependencies]
serde_json = { workspace = true }
